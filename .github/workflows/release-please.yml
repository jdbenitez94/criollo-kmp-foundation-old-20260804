# release-please on main: opens/updates a release PR from conventional commits.
# When that PR merges, it creates tag vX.Y.Z + GitHub Release, then publishes to Maven Central
# in this same workflow (GITHUB_TOKEN tag pushes do not trigger release.yml).
name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish Maven Central
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/publish-maven-central.yml
    secrets: inherit
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
